<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Wi-Fi Map</title>
  <meta name="description" content="Plan Wi-Fi coverage for your home or property. Works offline.">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wi-Fi Map">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt="" width="26" height="26"><span>Wi-Fi Map</span></div>
    <select id="floorSel" class="floor-sel" title="Floor"></select>
    <div class="band-switch" id="bandSwitch" role="group" aria-label="Band">
      <button data-band="2.4">2.4</button><button data-band="5">5</button><button data-band="6">6</button>
    </div>
    <div class="top-actions">
      <button id="btnUndo" class="icon-btn" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button id="btnRedo" class="icon-btn" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      <button id="btnFit" class="icon-btn" title="Fit to screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="btnPanel" class="icon-btn panel-toggle" title="Show / hide panel"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </header>

  <main class="layout">
    <nav class="toolbar" id="toolbar" aria-label="Tools">
      <button data-tool="select" title="Select / move (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6.5 1.8L10 19z"/></svg><span>Select</span></button>
      <button data-tool="pan" title="Pan (H)"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span>Pan</span></button>
      <button data-tool="wall" title="Draw wall (W)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5" stroke-width="3.2"/><circle cx="5" cy="19" r="1.6"/><circle cx="19" cy="5" r="1.6"/></svg><span>Wall</span></button>
      <button data-tool="room" title="Draw room (R)"><svg viewBox="0 0 24 24"><path d="M10 5H4v14h16V5h-4" stroke-width="2.6"/></svg><span>Room</span></button>
      <button data-tool="zone" title="Coverage area (Z)"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1" stroke-dasharray="3 2.5"/></svg><span>Area</span></button>
      <button data-tool="device" title="Place router / AP (D)"><svg viewBox="0 0 24 24"><path d="M4.5 10.5a11 11 0 0 1 15 0M7.5 13.5a6.5 6.5 0 0 1 9 0"/><circle cx="12" cy="17.5" r="1.8"/></svg><span>Device</span></button>
      <button data-tool="scale" title="Set scale (S)"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg><span>Scale</span></button>
      <button data-tool="survey" title="Add measured signal (M)"><svg viewBox="0 0 24 24"><path d="M12 21s-6-6-6-11a6 6 0 0 1 12 0c0 5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg><span>Measure</span></button>
    </nav>

    <section class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hint" id="hint"></div>
      <div class="tool-opts" id="toolOpts"></div>
      <div class="hud" id="hud" hidden></div>
      <div class="legend" id="legend"></div>
      <div class="busy" id="busy" hidden><div class="busy-bar"><i id="busyFill"></i></div><span id="busyText">Working…</span></div>
    </section>

    <aside class="panel" id="panel">
      <div class="tabs" role="tablist">
        <button data-tab="plan" class="active">Plan</button>
        <button data-tab="sel">Selected</button>
        <button data-tab="cov">Coverage</button>
        <button data-tab="sug">Suggest</button>
      </div>
      <div class="tab-body" id="tab-plan"></div>
      <div class="tab-body" id="tab-sel" hidden></div>
      <div class="tab-body" id="tab-cov" hidden></div>
      <div class="tab-body" id="tab-sug" hidden></div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <input type="file" id="fileImage" accept="image/*" hidden>
  <input type="file" id="fileScan" accept=".obj,.dxf,.json,application/json" hidden>
  <input type="file" id="fileProject" accept=".json,.wifimap,application/json" hidden>

  <dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

  <script src="js/engine.js"></script>
  <script src="js/optimizer.js"></script>
  <script src="js/importers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
